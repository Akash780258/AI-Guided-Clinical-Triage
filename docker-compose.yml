name: agct

services:
  postgres:
    image: postgres:16
    container_name: agct_postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "${POSTGRES_PORT}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - agct_network

  redis:
    image: redis:7-alpine
    container_name: agct_redis
    restart: unless-stopped

    command: redis-server --appendonly yes

    ports:
      - "${REDIS_PORT}:6379"

    volumes:
      - redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - agct_network

  neo4j:
    image: neo4j:5.26
    container_name: agct_neo4j
    restart: unless-stopped

    environment:
      NEO4J_AUTH: ${NEO4J_AUTH}

    ports:
      - "${NEO4J_HTTP_PORT}:7474"
      - "${NEO4J_BOLT_PORT}:7687"

    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs

    networks:
      - agct_network

  chromadb:
    image: chromadb/chroma:latest
    container_name: agct_chromadb
    restart: unless-stopped

    ports:
      - "${CHROMA_PORT}:8000"

    volumes:
      - chroma_data:/chroma/chroma

    networks:
      - agct_network

  ollama:
    image: ollama/ollama:latest
    container_name: agct_ollama
    restart: unless-stopped

    ports:
      - "${OLLAMA_PORT}:11434"

    volumes:
      - ollama_data:/root/.ollama

    networks:
      - agct_network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: agct_pgadmin
    restart: unless-stopped

    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: "False"

    ports:
      - "${PGADMIN_PORT}:80"

    depends_on:
      postgres:
        condition: service_healthy

    volumes:
      - pgadmin_data:/var/lib/pgadmin

    networks:
      - agct_network

volumes:
  postgres_data:
  redis_data:
  neo4j_data:
  neo4j_logs:
  chroma_data:
  ollama_data:
  pgadmin_data:

networks:
  agct_network:
    driver: bridge